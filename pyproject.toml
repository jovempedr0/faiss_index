[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faiss-index"
version = "0.2.0"
description = "Semantic indexing and search (FAISS + OpenAI-compatible embeddings) over documents of any type."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "numpy",
    "faiss-cpu",
    "openai>=1.40",
    "nltk",
    "python-dotenv",
    "scikit-learn",
    "psutil",
    "rank-bm25",
]

[project.optional-dependencies]
ocr = ["pdfplumber", "pytesseract", "pdf2image", "Pillow"]
rerank = ["sentence-transformers"]
dev = ["pytest"]
docs = ["mkdocs-material>=9,<10", "mkdocs<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
faiss_index = ["locale/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: requires a live OpenAI-compatible server (OPENAI_BASE_URL/OPENAI_API_KEY) with real models — excluded by default, run with `pytest -m integration`.",
]
