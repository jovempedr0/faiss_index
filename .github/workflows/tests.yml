name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # ocr: needed by tests/test_utils_ocr.py, which imports utils_ocr directly (the
      # package itself only imports it lazily, when a .pdf/.doc/.docx is read —
      # tests/test_optional_dependencies.py checks it imports fine without the extra).
      # The rerank extra is imported lazily inside CrossEncoderRerankProvider, which
      # the unit suite (pytest -m "not integration", the pyproject default) never
      # instantiates.
      - name: Install dependencies
        run: pip install -e ".[ocr,dev]"

      - name: Run tests
        run: pytest -v
